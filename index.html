<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phone Dart Challenge</title>
    <style>
        :root {
            --phone-bg-color: #5d34a4;
            --cell-bg-color: #f1f1f1;
            --main-font: sans-serif;
            --dart-width: 120px; 
            --dart-height: 240px;
        }

        * {
            /* Заборона виділення тексту та елементів */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            /* Прибирає синю рамку при натисканні на мобілках */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--phone-bg-color);
            background-image: linear-gradient(to bottom, #7a5ac1, var(--phone-bg-color), #402371);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--main-font);
            overflow: hidden; 
        }

        .game-screen {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            position: relative;
        }

        /* Grid - займає 65% екрана */
        .grid-container {
            height: 65vh;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            position: relative;
            z-index: 5;
            box-sizing: border-box;
        }

        .cell {
            background-color: var(--cell-bg-color);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid #ddd;
            transition: opacity 1s ease-out;
            /* Фіксуємо розмір, щоб не стискались */
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
        }

        .cell img {
            width: auto;
            height: auto;
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .balloon {
            width: 60px;
            height: 75px;
            border-radius: 50%;
            box-shadow: inset -5px -10px 15px rgba(0,0,0,0.2), inset 5px 10px 15px rgba(255,255,255,0.2);
            position: relative;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            width: 2px;
            height: 10px;
            background-color: rgba(0,0,0,0.2);
        }

        .balloon-popped {
            animation: balloon-pop 0.3s forwards;
        }

        @keyframes balloon-pop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Нижня зона */
        .dart-area {
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            position: relative;
        }

        .dart-button {
            width: var(--dart-width);
            height: var(--dart-height);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 101;
            outline: none; /* Прибирає контур при фокусі */
            padding: 0;
        }

        .dart-flying {
            position: fixed !important;
            pointer-events: none;
            z-index: 1000;
            transition: 
                top 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                left 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-vanish { background: #111 !important; }
        .hide-non-target { opacity: 0 !important; pointer-events: none; }
        .transparent-cell { background-color: transparent !important; border-color: transparent !important; }

        #fireworks-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15; display: none; pointer-events: none; overflow: hidden;
        }

        .particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            animation: explode 1.5s forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="game-screen" id="gameScreen">
        <div id="fireworks-container"></div>
        <div class="grid-container" id="gameGrid"></div>
        <div class="dart-area">
            <button class="dart-button" id="dartButton">
                <svg viewBox="0 0 100 160" width="100%" height="100%">
                    <defs>
                        <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#999"/><stop offset="50%" stop-color="#eee"/><stop offset="100%" stop-color="#666"/></linearGradient>
                        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#DAA520"/></linearGradient>
                        <linearGradient id="greenShaft" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2E7D32"/><stop offset="50%" stop-color="#4CAF50"/><stop offset="100%" stop-color="#1B5E20"/></linearGradient>
                    </defs>
                    <polygon points="50,5 45,45 55,45" fill="url(#metal)" />
                    <path d="M43,45 L57,45 L55,75 L45,75 Z" fill="url(#gold)" />
                    <rect x="46" y="75" width="8" height="35" fill="url(#greenShaft)" />
                    <path d="M50,90 Q15,115 15,145 L50,150 Z" fill="#4CAF50" />
                    <path d="M50,90 Q85,115 85,145 L50,150 Z" fill="#388E3C" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('gameGrid');
        const dartButton = document.getElementById('dartButton');
        const gameScreen = document.getElementById('gameScreen');
        
        const phoneImages = [
            'https://i.postimg.cc/fbNDHzXZ/1c0dd0b347cccb3ca6b426e9e60f4f3a-removebg-preview-(2).png',
            'https://i.postimg.cc/yxkHJkqR/0f6051110b6e06306ccecb74a3968dc9-removebg-preview-(1).png',
            'https://i.postimg.cc/ZqHtVr4r/9bb2ec7b0ba9bdffb8a94326146ca43d-removebg-preview-(1).png',
            'https://i.postimg.cc/t4dL4hZX/5fca03e6e1b68bcfda3b24c07e3542a9-removebg-preview-(1).png',
            'https://i.postimg.cc/qqCFVnHT/23df9839c3ce2f95f716a892261039fa-removebg-preview-(2).png',
            'https://i.postimg.cc/hPVSVQzY/a0c131bef843db23652f8c71ce54520d-removebg-preview-(1).png'
        ];
        const targetPhoneSrc = phoneImages[5];
        const balloonColors = ['magenta', 'limegreen', 'deepskyblue', 'blueviolet', 'gold', 'red'];
        
        let throwCount = 0;
        let unpoppedBalloons = [];

        function initGrid() {
            let items = phoneImages.map(src => ({ type: 'phone', src }));
            balloonColors.forEach(color => items.push({ type: 'balloon', color }));
            items.sort(() => Math.random() - 0.5);

            items.forEach((item, i) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                if (item.type === 'phone') {
                    const img = document.createElement('img');
                    img.src = item.src;
                    cell.appendChild(img);
                    if (item.src === targetPhoneSrc) cell.classList.add('target-cell');
                } else {
                    const b = document.createElement('div');
                    b.className = 'balloon';
                    b.style.backgroundColor = item.color;
                    cell.appendChild(b);
                    unpoppedBalloons.push(i);
                }
                grid.appendChild(cell);
            });
        }

        function throwDart(targetCell, callback) {
            const rect = dartButton.getBoundingClientRect();
            const targetRect = targetCell.getBoundingClientRect();
            
            dartButton.style.left = rect.left + 'px';
            dartButton.style.top = rect.top + 'px';
            dartButton.classList.add('dart-flying');

            const targetX = targetRect.left + (targetRect.width / 2) - (rect.width / 2);
            const targetY = targetRect.top + (targetRect.height / 2) - (rect.height / 2);

            setTimeout(() => {
                dartButton.style.left = targetX + 'px';
                dartButton.style.top = targetY + 'px';
                dartButton.style.transform = 'scale(0.2) rotate(10deg)';
                
                setTimeout(() => {
                    callback();
                    if (throwCount < 3) resetDart();
                }, 800);
            }, 10);
        }

        function resetDart() {
            dartButton.classList.remove('dart-flying');
            dartButton.style.left = '';
            dartButton.style.top = '';
            dartButton.style.transform = '';
            dartButton.style.pointerEvents = 'auto';
        }

        dartButton.addEventListener('click', (e) => {
            e.preventDefault(); // Запобігає зуму та іншим діям браузера
            throwCount++;
            dartButton.style.pointerEvents = 'none';

            if (throwCount <= 2) {
                const idxArr = unpoppedBalloons.splice(Math.floor(Math.random() * unpoppedBalloons.length), 1);
                const cell = document.getElementById(`cell-${idxArr[0]}`);
                throwDart(cell, () => {
                    const b = cell.querySelector('.balloon');
                    if (b) b.classList.add('balloon-popped');
                });
            } else {
                const cell = document.querySelector('.target-cell');
                throwDart(cell, () => {
                    showWin(cell);
                });
            }
        });

        function showWin(cell) {
            dartButton.style.opacity = '0';
            const img = cell.querySelector('img');
            gameScreen.classList.add('bg-vanish');
            document.querySelectorAll('.cell').forEach(c => {
                if (c !== cell) c.classList.add('hide-non-target');
                else c.classList.add('transparent-cell');
            });
            
            const sRect = gameScreen.getBoundingClientRect();
            const cRect = cell.getBoundingClientRect();
            const moveX = (sRect.width/2) - (cRect.left + cRect.width/2);
            const moveY = (sRect.height/2) - (cRect.top + cRect.height/2);

            img.style.transform = `translate(${moveX}px, ${moveY}px) scale(3.5)`;
            document.getElementById('fireworks-container').style.display = 'block';
            setInterval(createFirework, 400);
        }

        function createFirework() {
            const container = document.getElementById('fireworks-container');
            const f = document.createElement('div');
            f.style.position = 'absolute';
            f.style.left = Math.random() * 100 + '%';
            f.style.top = Math.random() * 60 + '%';
            container.appendChild(f);
            const colors = ['#ff0', '#f0f', '#0ff', '#fff'];
            for(let i=0; i<20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                const a = Math.random() * Math.PI * 2;
                const d = 50 + Math.random() * 80;
                p.style.setProperty('--tx', Math.cos(a)*d + 'px');
                p.style.setProperty('--ty', Math.sin(a)*d + 'px');
                f.appendChild(p);
            }
            setTimeout(() => f.remove(), 1500);
        }

        initGrid();
    </script>
</body>
</html>
